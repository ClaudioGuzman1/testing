<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 Tests - ODS App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    header h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .controls {
      padding: 20px 30px;
      background: #f5f5f5;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .output {
      padding: 30px;
      min-height: 400px;
      background: white;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.9em;
      line-height: 1.6;
      overflow-y: auto;
      max-height: 600px;
    }

    .log-entry {
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .log-success {
      color: #22c55e;
    }

    .log-error {
      color: #ef4444;
    }

    .log-info {
      color: #3b82f6;
    }

    .log-group {
      color: #8b5cf6;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 10px;
      padding: 10px;
      background: #f5f0ff;
      border-left: 4px solid #8b5cf6;
    }

    .summary {
      padding: 20px 30px;
      background: #f5f5f5;
      border-top: 1px solid #eee;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 0.9em;
    }

    .stat-passed .stat-value {
      color: #22c55e;
    }

    .stat-failed .stat-value {
      color: #ef4444;
    }

    .stat-total .stat-value {
      color: #3b82f6;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }

    footer {
      padding: 20px 30px;
      background: #f5f5f5;
      text-align: center;
      color: #666;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧪 Test Suite - ODS App</h1>
      <p>Validando comportamientos de la aplicación</p>
    </header>

    <div class="controls">
      <button class="btn-primary" id="runAllBtn">▶️ Ejecutar Todos</button>
      <button class="btn-secondary" id="clearBtn">🗑️ Limpiar Consola</button>
      <button class="btn-secondary" id="exportBtn">📥 Exportar Resultados</button>
    </div>

    <div class="output" id="output">
      <p style="color: #999; text-align: center; padding: 40px 0;">
        Haz click en "Ejecutar Todos" para comenzar los tests
      </p>
    </div>

    <div class="summary" id="summary" style="display: none;">
      <div class="stat stat-total">
        <div class="stat-value" id="totalTests">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat stat-passed">
        <div class="stat-value" id="passedTests">0</div>
        <div class="stat-label">Pasados</div>
      </div>
      <div class="stat stat-failed">
        <div class="stat-value" id="failedTests">0</div>
        <div class="stat-label">Fallidos</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="percentage">0%</div>
        <div class="stat-label">Éxito</div>
      </div>
    </div>

    <footer>
      <p>Tests ejecutándose en el navegador • Módulos refactorizados • Performance optimizado</p>
    </footer>
  </div>

  <!-- Cargar módulos en orden -->
  <script src="../js/constants.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/validators.js"></script>
  <script src="../js/images.js"></script>

  <!-- Framework de tests -->
  <script src="./test-runner.js"></script>

  <!-- Tests -->
  <script src="./db.test.js"></script>
  <script src="./validators.test.js"></script>
  <script src="./state.test.js"></script>
  <script src="./images.test.js"></script>

  <!-- Ejecutor de tests -->
  <script>
    // Interceptar console.log para mostrar en UI
    const output = document.getElementById('output');
    const summary = document.getElementById('summary');
    const originalLog = console.log;
    const originalGroup = console.group;
    const originalGroupEnd = console.groupEnd;
    const originalTable = console.table;

    let logBuffer = [];

    console.log = function(...args) {
      originalLog.apply(console, args);
      logBuffer.push({ type: 'log', args });
      updateOutput();
    };

    console.group = function(name) {
      logBuffer.push({ type: 'group', args: [name] });
      updateOutput();
    };

    console.groupEnd = function() {
      logBuffer.push({ type: 'groupEnd' });
      updateOutput();
    };

    console.table = function(data) {
      originalTable.apply(console, [data]);
      logBuffer.push({ type: 'table', args: [data] });
      updateOutput();
    };

    function updateOutput() {
      output.innerHTML = logBuffer.map(entry => {
        if (entry.type === 'group') {
          return `<div class="log-group">${entry.args[0]}</div>`;
        }
        if (entry.type === 'groupEnd') {
          return '';
        }
        if (entry.type === 'table') {
          const data = entry.args[0];
          if (Array.isArray(data)) {
            return `<div class="log-entry">${JSON.stringify(data, null, 2)}</div>`;
          }
          return `<div class="log-entry"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
        }

        let html = '<div class="log-entry ';
        const text = entry.args.join(' ');
        
        if (text.includes('✅')) html += 'log-success';
        else if (text.includes('❌')) html += 'log-error';
        else if (text.includes('🧪')) html += 'log-info';
        
        html += `">${escapeHtml(text)}</div>`;
        return html;
      }).join('');

      output.scrollTop = output.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Ejecutar tests
    document.getElementById('runAllBtn').addEventListener('click', async () => {
      logBuffer = [];
      output.innerHTML = '<div class="log-entry" style="text-align: center;"><span class="spinner"></span> Ejecutando tests...</div>';

      const suite = new TestSuite();
      suite.addSuite(dbTests);
      suite.addSuite(validatorsTests);
      suite.addSuite(stateTests);
      suite.addSuite(imagesTests);

      const results = await suite.run();

      // Actualizar resumen
      const totalPassed = results.reduce((sum, r) => sum + r.passed, 0);
      const totalFailed = results.reduce((sum, r) => sum + r.failed, 0);
      const totalTests = results.reduce((sum, r) => sum + r.total, 0);
      const percentage = Math.round((totalPassed / totalTests) * 100);

      document.getElementById('totalTests').textContent = totalTests;
      document.getElementById('passedTests').textContent = totalPassed;
      document.getElementById('failedTests').textContent = totalFailed;
      document.getElementById('percentage').textContent = percentage + '%';
      summary.style.display = 'grid';

      // Mostrar color según resultado
      if (totalFailed === 0) {
        document.getElementById('percentage').parentElement.style.color = '#22c55e';
      } else {
        document.getElementById('percentage').parentElement.style.color = '#ef4444';
      }
    });

    // Limpiar
    document.getElementById('clearBtn').addEventListener('click', () => {
      logBuffer = [];
      output.innerHTML = '<p style="color: #999; text-align: center; padding: 40px 0;">Consola limpia</p>';
      summary.style.display = 'none';
    });

    // Exportar
    document.getElementById('exportBtn').addEventListener('click', () => {
      const content = logBuffer.map(e => e.args.join(' ')).join('\n');
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'test-results.txt';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
