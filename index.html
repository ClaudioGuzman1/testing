<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">
  <title>Soy IDC ⚡</title>
  
  <!-- Precargar recursos críticos -->
  <link rel="preload" as="script" href="js/constants.js">
  <link rel="preload" as="style" href="styles.css">
  
  <!-- Prefetch de librerías externas -->
  <link rel="prefetch" href="https://cdn.tailwindcss.com">
  <link rel="prefetch" href="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">

  <!-- Estilos -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 2em;
      margin-bottom: 5px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.95em;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #f0f4ff;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-success {
      background: #22c55e;
      color: white;
    }

    input[type="text"],
    input[type="date"],
    input[type="tel"],
    input[type="email"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1em;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="tel"]:focus,
    input[type="email"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid #eee;
      margin-bottom: 20px;
    }

    [data-tab-btn] {
      padding: 12px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 600;
      color: #666;
      transition: all 0.3s;
    }

    [data-tab-btn]:hover {
      color: #667eea;
    }

    [data-tab-btn].active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    [data-tab] {
      display: none;
    }

    [data-tab].active {
      display: block;
    }

    .list-container {
      display: grid;
      gap: 15px;
    }

    .list-item {
      background: white;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
    }

    .list-item:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .list-item-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .list-item-actions button {
      padding: 8px 16px;
      font-size: 0.85em;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      font-size: 1.1em;
    }

    .image-preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .image-item {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1;
      background: #f0f0f0;
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-item button {
      position: absolute;
      top: 5px;
      right: 5px;
      padding: 5px 10px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8em;
    }

    #listView {
      display: block;
    }

    #formView {
      display: none;
    }

    .hidden {
      display: none !important;
    }

    /* Progress bar */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      button {
        padding: 12px 16px;
        font-size: 0.9em;
      }

      .tabs {
        overflow-x: auto;
      }

      [data-tab-btn] {
        padding: 10px 16px;
        white-space: nowrap;
      }
    }
  </style>

  <!-- Service Worker Registration Script (Inline para velocidad) -->
  <script>
    if ('serviceWorker' in navigator) {
      const basePath = window.location.pathname.split('/').filter(Boolean)[0] 
        ? '/' + window.location.pathname.split('/').filter(Boolean)[0] + '/'
        : '/';
      
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(basePath + 'service-worker.js', { scope: basePath })
          .catch(e => console.warn('⚠️ SW:', e.message));
      });
    }
  </script>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>📋 Orden de Servicio</h1>
    <p>Gestión de órdenes de mantenimiento técnico</p>
  </header>

  <!-- Contenedor principal -->
  <div class="container">

    <!-- VISTA DE LISTA -->
    <div id="listView">
      <div class="toolbar">
        <button id="newOrderBtn" class="btn-primary">➕ Nueva Orden</button>
        <button id="exportBtn" class="btn-secondary">📥 Descargar Datos</button>
        <button id="testsBtn" class="btn-secondary">🧪 Tests</button>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar por cliente, ticket, ubicación..." loading="lazy">
      </div>

      <div id="ordersList" class="list-container">
        <p style="text-align: center; color: #999; padding: 40px 0;">Cargando órdenes...</p>
      </div>
    </div>

    <!-- VISTA DE FORMULARIO -->
    <div id="formView" class="card">
      <h2 style="margin-bottom: 20px;">✏️ Formulario de Orden</h2>

      <!-- Tabs -->
      <div class="tabs">
        <button data-tab-btn="general" class="active">📝 General</button>
        <button data-tab-btn="mediciones">📐 Mediciones</button>
        <button data-tab-btn="evidencias">📷 Evidencias</button>
        <button data-tab-btn="entregas">📦 Entregas</button>
      </div>

      <!-- TAB: GENERAL -->
      <div data-tab="general" class="active">
        <div class="form-row">
          <div class="form-group">
            <label>Número de Ticket *</label>
            <input type="text" id="numeroTicket" placeholder="T001">
          </div>
          <div class="form-group">
            <label>Fecha de Atención *</label>
            <input type="date" id="fechaAtencion">
          </div>
          <div class="form-group">
            <label>Ingeniero *</label>
            <input type="text" id="ingeniero" placeholder="Juan Pérez">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Cliente *</label>
            <input type="text" id="cliente" placeholder="Nombre del cliente">
          </div>
          <div class="form-group">
            <label>Contacto *</label>
            <input type="text" id="contacto" placeholder="Nombre del contacto">
          </div>
          <div class="form-group">
            <label>Cargo</label>
            <input type="text" id="cargo" placeholder="Cargo del contacto">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Teléfono *</label>
            <input type="tel" id="telefono" placeholder="6687654321">
          </div>
          <div class="form-group">
            <label>Correo</label>
            <input type="email" id="correo" placeholder="cliente@example.com">
          </div>
          <div class="form-group">
            <label>Ubicación *</label>
            <input type="text" id="ubicacion" placeholder="Ubicación del sitio">
          </div>
        </div>

        <div class="form-group">
          <label>Dirección</label>
          <textarea id="direccion" rows="3" placeholder="Dirección completa"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Tipo de Servicio *</label>
            <select id="tipoServicio">
              <option value="">-- Seleccionar --</option>
              <option value="Instalación">Instalación</option>
              <option value="Mantenimiento">Mantenimiento</option>
              <option value="Reparación">Reparación</option>
              <option value="Soporte">Soporte</option>
            </select>
          </div>
          <div class="form-group">
            <label>Incidencia *</label>
            <textarea id="incidencia" rows="3" placeholder="Descripción del problema"></textarea>
          </div>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="solicitaTerminal"> ¿Solicita Terminal?
          </label>
        </div>

        <div id="terminalFields" style="display: none;">
          <div class="form-row">
            <div class="form-group">
              <label>Nombre de Terminal</label>
              <input type="text" id="nombreTerminal" placeholder="Nombre o modelo">
            </div>
            <div class="form-group">
              <label>Modelo Terminal</label>
              <input type="text" id="modeloTerminal" placeholder="Modelo específico">
            </div>
          </div>
        </div>
      </div>

      <!-- TAB: MEDICIONES -->
      <div data-tab="mediciones">
        <div class="form-row">
          <div class="form-group">
            <label>Serie Retirada</label>
            <input type="text" id="serieRetirada" placeholder="Serial number">
          </div>
          <div class="form-group">
            <label>MAC Retirada</label>
            <input type="text" id="macRetirada" placeholder="00:1A:2B:3C:4D:5E">
          </div>
          <div class="form-group">
            <label>Falla Retirada</label>
            <input type="text" id="fallaRetirada" placeholder="Descripción de falla">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Serie Instalada</label>
            <input type="text" id="serieInstalada" placeholder="Serial number">
          </div>
          <div class="form-group">
            <label>MAC Instalada</label>
            <input type="text" id="macInstalada" placeholder="00:1A:2B:3C:4D:5E">
          </div>
        </div>

        <div class="form-group">
          <label>Solución Aplicada</label>
          <textarea id="solucion" rows="4" placeholder="Descripción detallada de la solución"></textarea>
        </div>

        <div class="form-group">
          <label>Comentarios Adicionales</label>
          <textarea id="comentario" rows="3" placeholder="Observaciones y comentarios"></textarea>
        </div>
      </div>

      <!-- TAB: EVIDENCIAS -->
      <div data-tab="evidencias">
        <div class="form-group">
          <label>📷 Imágenes Iniciales</label>
          <input type="file" data-image-input data-category="inicial" accept="image/*" loading="lazy">
          <div id="imagenesiniciales" class="image-preview"></div>
        </div>

        <div class="form-group">
          <label>📐 Imágenes de Mediciones</label>
          <input type="file" data-image-input data-category="mediciones" accept="image/*" loading="lazy">
          <div id="imagenesmediciones" class="image-preview"></div>
        </div>

        <div class="form-group">
          <label>🔧 Imágenes de Instalación</label>
          <input type="file" data-image-input data-category="instalacion" accept="image/*" loading="lazy">
          <div id="imagenesinstalacion" class="image-preview"></div>
        </div>

        <div class="form-group">
          <label>✨ Imágenes Extras</label>
          <input type="file" data-image-input data-category="extras" accept="image/*" loading="lazy">
          <div id="imagenesextras" class="image-preview"></div>
        </div>

        <p style="color: #666; margin-top: 20px;">
          📊 Imágenes: <span id="imageCount">0</span>
        </p>
      </div>

      <!-- TAB: ENTREGAS -->
      <div data-tab="entregas">
        <div class="form-group">
          <label>Materiales Entregados</label>
          <textarea id="materiales" rows="5" placeholder="Lista de materiales entregados al cliente" loading="lazy"></textarea>
        </div>
      </div>

      <!-- Acciones del formulario -->
      <div style="margin-top: 30px; display: flex; gap: 10px;">
        <button id="saveOrderBtn" class="btn-primary">💾 Guardar Orden</button>
        <button id="cancelFormBtn" class="btn-secondary">❌ Cancelar</button>
        <button id="generatePdfBtn" class="btn-success" style="display: none;">📄 Generar PDF</button>
      </div>
    </div>

  </div>

  <!-- ============ SCRIPTS ============ -->
  <!-- Fase 1: Configuración y Estado (Crítico) -->
  <script src="js/constants.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/validators.js" defer></script>

  <!-- Fase 2: Core (Cargar después de Fase 1) -->
  <script src="js/db.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/toast.js" defer></script>

  <!-- Fase 3: Features (Lazy loading) -->
  <script src="js/images.js" defer></script>
  <script src="js/pdf.js" defer></script>

  <!-- Fase 4: Handlers y Inicialización -->
  <script src="js/handlers.js" defer></script>
  <script src="js/app.js" defer></script>

  <!-- Librerías externas (CDN) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Inline script para inicializaciones rápidas -->
  <script>
    // Mostrar fecha actual en el formulario
    document.addEventListener('DOMContentLoaded', () => {
      const fechaInput = document.getElementById('fechaAtencion');
      if (fechaInput && !fechaInput.value) {
        fechaInput.valueAsDate = new Date();
      }

      // Mostrar/ocultar campos de terminal
      document.getElementById('solicitaTerminal')?.addEventListener('change', (e) => {
        document.getElementById('terminalFields').style.display = 
          e.target.checked ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
